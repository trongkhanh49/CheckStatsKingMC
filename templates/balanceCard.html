<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;padding:20px;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;
  background:transparent
}
.balance-card{position:relative;overflow:hidden;width:720px;min-height:245px;padding:24px;border-radius:22px;
  background:linear-gradient(rgba(16,21,31,.70),rgba(18,22,30,.84)),url('{{BACKGROUND}}') center/cover no-repeat;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 55px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);
}
.balance-card::before{content:'';position:absolute;inset:-20px;background:url('{{BACKGROUND}}') center/cover no-repeat;filter:blur(10px);opacity:.28;transform:scale(1.05);z-index:0}
.balance-card>*{position:relative;z-index:1}

.head{display:flex;align-items:center;gap:18px}
.avatar{width:76px;height:76px;border-radius:13px;object-fit:cover}
.player{font-size:25px;font-weight:800}
.sub{color:#99a5b5;font-size:13px;margin-top:4px}
.money{
  margin-top:22px;padding:22px;border-radius:16px;
  background:linear-gradient(135deg,rgba(28,75,51,.48),rgba(17,30,27,.72));
  border:1px solid rgba(78,220,135,.25)
}
.label{font-size:13px;color:#9eaeaa;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.value{font-size:34px;font-weight:900;color:#62ef9a;margin-top:5px}
.footer{margin-top:15px;color:#7f8b9b;font-size:11px;text-align:right}
</style>
</head>
<body>
<div class="balance-card">
  <div class="head">
    <img class="avatar" src="{{AVATAR}}" onerror="this.onerror=null;this.src='{{FALLBACK_AVATAR}}'">
    <div><div class="player">{{PLAYER}}</div><div class="sub">KingMC.vn • Số dư tài khoản</div></div>
  </div>
  <div class="money"><div class="label">Money</div><div class="value">{{MONEY}}</div></div>
  <div class="footer">✦ KingMC.vn • Balance • Thiết kế bởi ntkhanh</div>
</div>
</body>
</html>
